syntax = "proto3";

package examples.demo;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service DemoService {
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option (google.api.http) = {get: "/v1/items/{id}"};
  }

  rpc GetContactProfile(GetContactProfileRequest) returns (ContactProfile) {
    option (google.api.http) = {get: "/v1/contacts/{user_id}"};
  }
}

message GetItemRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetItemResponse {
  string name = 1 [(buf.validate.field).string.min_len = 3];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
  ItemType type = 3;
  repeated string tags = 4 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {pattern: "^[a-z][a-z_]+[a-z]$"}
    }
  }];

  map<string, string> attributes = 5 [(buf.validate.field).map = {
    min_pairs: 1
    keys: {
      string: {pattern: "^[a-z][a-z_]+[a-z]$"}
    }
  }];

  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Duration duration = 7;
  map<string, google.protobuf.Value> extra_info = 8 [(buf.validate.field).map = {
    min_pairs: 1
    keys: {
      string: {pattern: "^[a-z][a-z_]+[a-z]$"}
    }
  }];

  oneof status {
    string status_message = 9;
    int32 status_code = 10;
  }
}

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_PHYSICAL = 1;
  ITEM_TYPE_DIGITAL = 2;
}

message GetContactProfileRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message ContactProfile {
  // Identification
  string user_id = 1;

  // Name
  string full_name = 2;

  // Contact Info
  string email_address = 3;
  string phone_number = 4;

  // Address Info
  string city = 5;
  string country = 6;

  // System & Network Info
  string client_ip = 7;
  string user_agent = 8;

  // Work Info
  string company_name = 9;
  string job_title = 10;
}
